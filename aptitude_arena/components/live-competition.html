<!-- SkillBridge Aptitude Arena - Modular Section: Live Competition -->
<section id="live-competition-component" class="flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto">
  <!-- Left Canvas -->
  <div class="flex-grow flex flex-col gap-5">
    <!-- Status Header -->
    <div class="bg-white border border-[#c7c4d8] p-4 rounded-2xl shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-[#3525cd] text-white flex items-center justify-center">
          <span class="material-symbols-outlined text-xl">bolt</span>
        </div>
        <div>
          <h2 class="text-base font-bold text-[#191c1e]">Aptitude Arena Live</h2>
          <p class="text-xs text-[#464555]">Room: <span class="font-mono font-bold text-[#3525cd]">7K4P9</span></p>
        </div>
      </div>

      <div class="bg-[#ffdad6] text-[#93000a] px-3.5 py-1.5 rounded-lg flex items-center gap-2 border border-[#ba1a1a]/30 shadow-sm animate-pulse">
        <span class="material-symbols-outlined text-base">timer</span>
        <span class="font-mono text-base font-bold">01:07</span>
      </div>
    </div>

    <!-- Question Card -->
    <div class="bg-white border border-[#c7c4d8] rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col justify-between flex-grow min-h-[420px] relative overflow-hidden">
      <!-- Animated Timer Bar -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-[#e6e8ea]">
        <div class="h-full bg-[#3525cd] rounded-r-full" style="width: 70%;"></div>
      </div>

      <div class="pt-1">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-4 pb-3 border-b border-[#c7c4d8]/60">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-[#3525cd] uppercase tracking-wider bg-[#e2dfff] px-3 py-1 rounded-full">
              Quantitative Aptitude
            </span>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm bg-emerald-100 text-emerald-800 border border-emerald-300">
              <span>🟢</span> Easy • 30s
            </span>
          </div>
          <span class="text-xs font-semibold text-[#464555] bg-[#e6e8ea] px-3 py-1 rounded-full">
            Question 1 of 10
          </span>
        </div>

        <h3 class="text-xl sm:text-2xl font-bold text-[#191c1e] leading-snug mb-6">
          If a train travels at 60 km/h, how long does it take to cover a distance of 150 km?
        </h3>
      </div>

      <!-- Multiple Choice Options -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-4">
        <button class="w-full text-left p-4 rounded-xl border-2 border-[#c7c4d8] bg-white hover:border-[#3525cd] hover:bg-[#f8fafc] transition flex items-center gap-3.5">
          <div class="w-8 h-8 rounded-lg bg-[#e6e8ea] text-[#191c1e] font-bold text-xs flex items-center justify-center">A</div>
          <span class="text-sm font-semibold text-[#191c1e]">2 hours</span>
        </button>

        <button class="w-full text-left p-4 rounded-xl border-2 border-[#3525cd] bg-[#f0f1fe] flex items-center justify-between">
          <div class="flex items-center gap-3.5">
            <div class="w-8 h-8 rounded-lg bg-[#3525cd] text-white font-bold text-xs flex items-center justify-center">
              <span class="material-symbols-outlined text-sm">check</span>
            </div>
            <span class="text-sm font-semibold text-[#191c1e]">2.5 hours</span>
          </div>
          <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-[#3525cd] text-white">Submitted</span>
        </button>

        <button class="w-full text-left p-4 rounded-xl border-2 border-[#c7c4d8] bg-white hover:border-[#3525cd] hover:bg-[#f8fafc] transition flex items-center gap-3.5">
          <div class="w-8 h-8 rounded-lg bg-[#e6e8ea] text-[#191c1e] font-bold text-xs flex items-center justify-center">C</div>
          <span class="text-sm font-semibold text-[#191c1e]">3 hours</span>
        </button>

        <button class="w-full text-left p-4 rounded-xl border-2 border-[#c7c4d8] bg-white hover:border-[#3525cd] hover:bg-[#f8fafc] transition flex items-center gap-3.5">
          <div class="w-8 h-8 rounded-lg bg-[#e6e8ea] text-[#191c1e] font-bold text-xs flex items-center justify-center">D</div>
          <span class="text-sm font-semibold text-[#191c1e]">3.5 hours</span>
        </button>
      </div>

      <!-- Question Dots -->
      <div class="pt-5 border-t border-[#c7c4d8]/60 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded-full bg-[#006c49]"></div>
          <div class="w-3 h-3 rounded-full bg-[#ba1a1a]"></div>
          <div class="w-3 h-3 rounded-full bg-[#006c49]"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-[#3525cd] ring-2 ring-[#3525cd]/40 ring-offset-2 animate-pulse"></div>
          <div class="w-3 h-3 rounded-full border border-[#c7c4d8] bg-[#e6e8ea]"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Leaderboard Sidebar -->
  <aside class="w-full lg:w-80 flex flex-col gap-4">
    <div class="bg-white rounded-2xl border border-[#c7c4d8] shadow-sm p-5 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-[#c7c4d8]/60">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[#3525cd]">leaderboard</span>
          <h3 class="font-bold text-base text-[#191c1e]">Live Standings</h3>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-wider bg-[#6cf8bb] text-[#00714d] px-2 py-0.5 rounded-full">
          Live Scores
        </span>
      </div>

      <div class="flex flex-col gap-2.5">
        <!-- Rank 1 -->
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-[#f2f4f6]">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center text-xs font-bold">1</div>
            <span class="text-xs font-semibold text-[#191c1e]">Ananya Deshmukh</span>
          </div>
          <span class="font-mono text-xs font-bold text-[#464555]">320</span>
        </div>

        <!-- Rank 2: User Highlight -->
        <div class="flex items-center justify-between p-3 rounded-xl bg-[#3525cd] text-white shadow-md">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-full bg-white text-[#3525cd] flex items-center justify-center text-xs font-extrabold">2</div>
            <div>
              <span class="text-xs font-bold">Rahul (YOU)</span>
            </div>
          </div>
          <span class="font-mono text-sm font-extrabold">295</span>
        </div>
      </div>
    </div>
  </aside>
</section>

name: AI Career Engine Automated Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ai-career-engine/requirements.txt ]; then pip install -r ai-career-engine/requirements.txt; fi
          pip install pydantic matplotlib numpy

      - name: Run Layer 1 & Layer 2 Tests (Unit + Integration)
        env:
          PYTHONPATH: ai-career-engine
        run: |
          python run_tests.py

      - name: Run System Evaluation Benchmark
        env:
          PYTHONPATH: ai-career-engine
        run: |
          cd ai-career-engine && python evaluate.py
